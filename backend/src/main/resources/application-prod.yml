spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

gemini:
  api:
    key: ${GEMINI_API_KEY}

chroma:
  endpoint: ${CHROMA_ENDPOINT}
  collection:
    name: resume_chunks

jwt:
  secret: ${JWT_SECRET}
